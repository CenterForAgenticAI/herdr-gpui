# DigitalOcean App Platform: the relay from the published image, with no
# server to manage.
#
#   doctl apps create --spec deploy/relay/app.yaml
#
# App Platform carries HTTP only, not UDP, so the relay runs here without
# QUIC: clients use its WebSocket fallback. For QUIC, the faster transport,
# use a droplet instead (create-droplet.sh).
#
# App Platform sets PORT, which the relay listens on; puts the caller's
# address in do-connecting-ip; and fills ${APP_DOMAIN} with the app's own
# name, which WebSocket proofs must cover. To turn the dashboard on, add
# RELAY_DASHBOARD_PASSWORD (12+ characters) as an encrypted variable in the
# app's settings, then open https://APP_DOMAIN/dashboard.
name: sheprd-relay
region: nyc
services:
  - name: relay
    image:
      registry_type: GHCR
      registry: sheprd-labs
      repository: sheprd-relay
      tag: latest
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /healthz
    routes:
      - path: /
    envs:
      - key: RELAY_PUBLIC_HOST
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: RELAY_CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
      - key: RELAY_QUIC
        scope: RUN_TIME
        value: "off"
      - key: RELAY_METRICS
        scope: RUN_TIME
        value: "off"
