version: 2

updates:
  # Pinned action SHAs go stale silently; this is the only thing watching them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually yanked within days. Waiting keeps an
    # automated PR from being the thing that pulls it in.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # Images pinned by digest: the relay's build bases and the droplet's
  # Caddy. Digests on a moving tag go stale as silently as action SHAs.
  - package-ecosystem: docker
    directory: /crates/sheprd-relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /deploy/relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Workspace dependencies. Grouped so the lockfile moves in one reviewable PR
  # rather than many, matching the "avoid unrelated lockfile upgrades" rule.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # GPUI is pinned to an exact version deliberately; upgrades are a manual,
      # tested change, not a dependency bump.
      - dependency-name: gpui
