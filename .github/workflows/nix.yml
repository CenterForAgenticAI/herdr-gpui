name: Nix

# The flake builds from source with the pinned toolchain. Pushes and pull
# requests run it when its inputs, the lockfile, or the toolchain pin change;
# the release workflow calls it for every release, because one cargo build of
# the Rust packages unifies their features and can fail where CI's per-crate
# builds pass.
on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to build
        required: true
        type: string
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE
      - NOTICE
      - assets/macos/**
      - assets/icons/**
      - macos/sheprd-nearby/**
      - crates/sheprd-gpui/SOUND-NOTICE.md
      - scripts/release/herdr-core.json
      - scripts/release/herdr-core-licenses.txt
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE
      - NOTICE
      - assets/macos/**
      - assets/icons/**
      - macos/sheprd-nearby/**
      - crates/sheprd-gpui/SOUND-NOTICE.md
      - scripts/release/herdr-core.json
      - scripts/release/herdr-core-licenses.txt
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions: {}

# A called workflow sees its caller's github context, so the workflow name
# keeps a release's build out of the push builds' group, where a push to main
# would cancel it.
concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs use GitHub's approval boundary, as in ci.yml. Called from the
    # release workflow, event_name is its workflow_dispatch.
    if: >-
      (github.repository == 'sheprd-labs/sheprd' || github.repository == 'penso/herdr-gpui') &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'penso' && github.triggering_actor == 'penso' &&
        github.ref == 'refs/heads/main'))
    name: Nix flake (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check the flake and build the package in the Nix sandbox
        run: |
          nix flake check --no-build
          nix build -L --print-out-paths
      - name: Run the built executable's CLI without a desktop
        run: |
          ./result/bin/sheprd --help >/dev/null
          ./result/bin/herdr-gpui --help >/dev/null
          if [ "$(uname -s)" = "Darwin" ]; then
            test -d result/Applications/Sheprd.app
            test -x result/Applications/Sheprd.app/Contents/MacOS/sheprd
            test -f result/Applications/Sheprd.app/Contents/Info.plist
            test -x result/Applications/Sheprd.app/Contents/MacOS/herdr-core
            ./result/bin/herdr-core --version
            # Require the native CoreBluetooth implementation, not the Rust
            # unsupported backend. EOF checks startup without a permission prompt.
            otool -L result/Applications/Sheprd.app/Contents/MacOS/sheprd-nearby | grep CoreBluetooth
            python3 -c 'import subprocess; subprocess.run(["./result/bin/sheprd-nearby", "--no-bluetooth"], stdin=subprocess.DEVNULL, check=True, timeout=10)'
            for helper in acp automate nearby remote-control; do
              test -x "result/bin/sheprd-$helper"
              test -x "result/bin/herdr-$helper"
            done
          else
            test "$(readlink result/bin/herdr-gpui)" = sheprd
            for helper in acp automate nearby remote-control; do
              test "$(readlink "result/bin/herdr-$helper")" = "sheprd-$helper"
              test -x "result/bin/herdr-$helper"
            done
            test -f result/share/applications/org.sheprd.Sheprd.desktop
            if ldd result/bin/sheprd | grep 'not found'; then exit 1; fi
          fi
