# DigitalOcean's "Deploy to DigitalOcean" button: a Sheprd relay on App
# Platform from the published image, with no server to manage.
#
#   https://cloud.digitalocean.com/apps/new?repo=https://github.com/sheprd-labs/sheprd/tree/main
#
# App Platform carries HTTP only, not UDP, so the relay runs without QUIC:
# clients use its WebSocket fallback. For QUIC too, use a droplet
# (deploy/relay/create-droplet.sh). See https://sheprd.org/docs/relays/.
# deploy/relay/app.yaml is the same app for `doctl apps create --spec`; a
# test keeps the two in step.
spec:
  name: sheprd-relay
  services:
    - name: relay
      image:
        registry_type: GHCR
        registry: ghcr.io
        repository: sheprd-labs/sheprd-relay
        # Unverified: App Platform cannot check the image's cosign
        # signature, and a push to :latest reaches the app on its next
        # deploy. To pin, verify a digest (deploy/relay/README.md) and
        # replace this line with `digest: sha256:...`.
        tag: latest
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      http_port: 8080
      health_check:
        http_path: /healthz
      routes:
        - path: /
      envs:
        - key: RELAY_PUBLIC_HOST
          scope: RUN_TIME
          value: ${APP_DOMAIN}
        - key: RELAY_CLIENT_IP_HEADER
          scope: RUN_TIME
          value: do-connecting-ip
        - key: RELAY_QUIC
          scope: RUN_TIME
          value: "off"
        - key: RELAY_METRICS
          scope: RUN_TIME
          value: "off"
